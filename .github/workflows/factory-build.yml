# Factory stage 3: Building
#
# Human gate: a maintainer adds `factory:plan-approved` after reading the plan.
# The builder implements the plan on `factory/issue-<n>`, opens a PR, and hands the PR
# to the review loop via workflow_dispatch (events created with GITHUB_TOKEN do not
# trigger other workflows, but workflow_dispatch is the documented exception).
name: "Factory: build"

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

env:
  ISSUE: ${{ github.event.issue.number }}
  BRANCH: factory/issue-${{ github.event.issue.number }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.label.name == 'factory:plan-approved' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # Job-level so unrelated comment events never queue behind (or cancel) real work.
    concurrency:
      group: factory-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Move card to Building
        run: gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label factory:building --remove-label factory:plan-ready

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare branch
        run: |
          git config user.name  "factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      # Add your toolchain here (actions/setup-node, setup-python, ...) so the agent can
      # run the checks listed in CLAUDE.md.

      - name: Build agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Repository: ${{ github.repository }}. Issue: #${{ github.event.issue.number }}.
            Branch: ${{ env.BRANCH }} (already checked out). Base branch: ${{ github.event.repository.default_branch }}.
            Read .github/factory/agents/builder.md and follow it exactly.
          claude_args: >-
            --model ${{ vars.FACTORY_MODEL_BUILD || vars.FACTORY_MODEL || 'claude-opus-5-5' }}
            --max-turns 120
            --allowedTools "${{ vars.FACTORY_BUILD_TOOLS || 'Read,Glob,Grep,Edit,Write,MultiEdit,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(node:*),Bash(python:*),Bash(pytest:*),Bash(make:*),Bash(go:*),Bash(cargo:*),Bash(ls:*),Bash(cat:*)' }}"

      - name: Hand off to review
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label factory:needs-human --remove-label factory:building
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Factory: the build agent did not open a pull request. A human needs to look at this issue."
            exit 1
          fi
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label factory:in-review --remove-label factory:building
          gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --add-label factory
          gh workflow run factory-review.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="$pr" -f iteration=0
