# Human-in-the-loop: mention @claude on any issue or PR to talk to an agent directly
# (e.g. "@claude please also handle the empty-list case"). The action only responds to
# users with write access.
name: "Factory: @claude assist"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  assist:
    if: >-
      (github.event.comment && contains(github.event.comment.body, '@claude')) ||
      (github.event.review && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ vars.FACTORY_MODEL || 'claude-opus-5-5' }}
