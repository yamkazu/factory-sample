# Verify: address PR feedback   (SuperPlane: "Address PR feedback", mention-only)
# Runs only when someone with write access (or the PR author) starts a comment, review,
# or review reply with `/factory` on a factory PR. Ordinary reviews are left to people.
name: "Factory: PR feedback"

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PR: ${{ github.event.issue.number || github.event.pull_request.number }}
  FACTORY_PUSH_TRIGGERS: ${{ vars.FACTORY_APP_ID != '' }}
  READ_TOOLS: "Skill,Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git rev-parse:*),Bash(ls:*)"
  WRITE_TOOLS: "Edit,MultiEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git restore:*),Bash(mkdir:*),Bash(rm:*),Bash(mv:*)"
  CHECK_TOOLS: ${{ vars.FACTORY_CHECK_TOOLS || 'Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(node:*),Bash(python:*),Bash(pytest:*),Bash(make:*),Bash(go:*),Bash(cargo:*)' }}

jobs:
  feedback:
    if: >-
      (github.event.issue.pull_request != null || github.event.pull_request != null) &&
      startsWith(github.event.comment.body || github.event.review.body || '', '/factory') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: factory-pr-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Factory token
        id: app
        if: vars.FACTORY_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Resolve PR
        id: pr
        run: |
          read -r sha branch < <(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid,headRefName -q '"\(.headRefOid) \(.headRefName)"')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [[ "$branch" == factory/* ]]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Not a factory PR."; fi

      - uses: actions/checkout@v4
        if: steps.pr.outputs.ok == 'true'
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Acknowledge and collect feedback
        id: prepare
        if: steps.pr.outputs.ok == 'true'
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          URL: ${{ github.event.comment.html_url || github.event.review.html_url }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          source .github/factory/lib.sh
          if [ -n "$COMMENT_ID" ]; then
            kind=issues; [ "${{ github.event_name }}" = pull_request_review_comment ] && kind=pulls
            gh api -X POST "repos/$GITHUB_REPOSITORY/$kind/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
          fi
          add_label pr "$PR" factory:running
          git config user.name  "factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$FACTORY_TMP"
          { echo "呼び出したコメント: $URL"; echo; printf '%s\n' "$BODY"; } > "$FACTORY_TMP/request.md"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
            --jq '.[] | {id, path, line, user: .user.login, body, in_reply_to_id, created_at}' > "$FACTORY_TMP/review-comments.jsonl"

      # Add your toolchain here, same as factory-implement.yml.

      - name: Feedback agent
        if: steps.pr.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            factory-phase: verify / pr-feedback
            リポジトリ: ${{ github.repository }} / PR: #${{ env.PR }}
            ブランチ: ${{ steps.pr.outputs.branch }}（チェックアウト済み）
            呼び出したコメントは .factory-tmp/request.md、行コメントは .factory-tmp/review-comments.jsonl にあります。
            factory-pr-feedback スキル（.claude/skills/factory-pr-feedback/SKILL.md）に従って対応してください。
          claude_args: >-
            --model ${{ vars.FACTORY_MODEL_IMPLEMENT || vars.FACTORY_MODEL || 'claude-opus-5-5' }}
            --max-turns 120
            --allowedTools "${{ env.READ_TOOLS }},${{ env.WRITE_TOOLS }},${{ env.CHECK_TOOLS }}"

      - name: Hand off back to Verify
        if: always() && steps.prepare.outcome == 'success'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          source .github/factory/lib.sh
          accept_handoff pr "$PR" addressed no-action
          remove_label pr "$PR" factory:running
          [ "$VERDICT" = addressed ] || exit 0
          git fetch -q origin "$BRANCH"
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" ] || escalate pr "$PR" "ローカルのコミットがすべてプッシュされていません。"
          post_file pr "$PR" "$FACTORY_TMP/comment.md"
          [ "$(git rev-parse HEAD)" = "$SHA" ] || after_push "$PR"
