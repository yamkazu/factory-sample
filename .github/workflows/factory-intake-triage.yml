# Stages: Intake -> Triage   (Mastra Factory: Intake / Triage)
#
# Intake  every new issue is put on the board (`factory:intake`). Nothing runs yet.
# Start   a person starts the run by adding `factory:start`. If FACTORY_AUTO_START is
#         'true', issues opened by OWNER/MEMBER/COLLABORATOR start automatically
#         (Mastra: "the phase starts automatically if the item is eligible").
# Triage  the factory-triage skill investigates and hands off ready / needs-info.
#         bug        -> straight to Planning
#         other type -> waits for a person to accept it with `factory:plan`
#                       (Mastra: people accept non-bug tasks before planning)
name: "Factory: intake & triage"

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage
        required: true

permissions:
  contents: read
  issues: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  ISSUE: ${{ inputs.issue || github.event.issue.number }}
  READ_TOOLS: "Skill,Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git rev-parse:*)"

jobs:
  intake:
    if: github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.intake.outputs.start }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the issue on the board
        id: intake
        env:
          FACTORY_PROJECT_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          FACTORY_PROJECT_NUMBER: ${{ vars.FACTORY_PROJECT_NUMBER }}
          FACTORY_PROJECT_OWNER: ${{ vars.FACTORY_PROJECT_OWNER }}
          AUTO_START: ${{ vars.FACTORY_AUTO_START || 'false' }}
          TRUSTED: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
        run: |
          source .github/factory/lib.sh
          set_stage issue "$ISSUE" factory:intake
          if [ "$AUTO_START" = true ] && [ "$TRUSTED" = true ]; then
            echo "start=true" >> "$GITHUB_OUTPUT"
          fi

  triage:
    needs: intake
    if: >-
      always() && github.event.issue.pull_request == null && (
        needs.intake.outputs.start == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'factory:start' && github.event.sender.type != 'Bot') ||
        (github.event_name == 'issue_comment' &&
          contains(github.event.issue.labels.*.name, 'factory:needs-info') &&
          github.event.comment.user.type != 'Bot' &&
          (github.event.comment.user.login == github.event.issue.user.login ||
           contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: factory-issue-${{ inputs.issue || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move to Triage
        id: prepare
        env:
          FACTORY_PROJECT_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          FACTORY_PROJECT_NUMBER: ${{ vars.FACTORY_PROJECT_NUMBER }}
          FACTORY_PROJECT_OWNER: ${{ vars.FACTORY_PROJECT_OWNER }}
        run: |
          source .github/factory/lib.sh
          set_stage issue "$ISSUE" factory:triage
          remove_label issue "$ISSUE" factory:start factory:needs-info factory:waiting factory:needs-human
          add_label issue "$ISSUE" factory:running
          mkdir -p "$FACTORY_TMP"

      - name: Triage agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            factory-phase: triage
            リポジトリ: ${{ github.repository }} / Issue: #${{ env.ISSUE }}
            factory-triage スキル（.claude/skills/factory-triage/SKILL.md）に従って、この Issue を仕分けしてください。
          claude_args: >-
            --model ${{ vars.FACTORY_MODEL_TRIAGE || vars.FACTORY_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 40
            --allowedTools "${{ env.READ_TOOLS }}"

      - name: Hand off
        if: always() && steps.prepare.outcome == 'success'
        env:
          FACTORY_PROJECT_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          FACTORY_PROJECT_NUMBER: ${{ vars.FACTORY_PROJECT_NUMBER }}
          FACTORY_PROJECT_OWNER: ${{ vars.FACTORY_PROJECT_OWNER }}
          AUTO_ACCEPT: ${{ vars.FACTORY_AUTO_ACCEPT || 'false' }}
        run: |
          source .github/factory/lib.sh
          accept_handoff issue "$ISSUE" ready needs-info
          post_file issue "$ISSUE" "$FACTORY_TMP/comment.md"
          remove_label issue "$ISSUE" factory:running
          type=$(field type)
          case "$type" in bug|feature|chore|docs) add_label issue "$ISSUE" "type:$type" ;; esac

          if [ "$VERDICT" = needs-info ]; then
            add_label issue "$ISSUE" factory:needs-info
            exit 0
          fi
          if [ "$type" = bug ] || [ "$AUTO_ACCEPT" = true ]; then
            dispatch factory-plan.yml issue="$ISSUE"
          else
            add_label issue "$ISSUE" factory:waiting
            say issue "$ISSUE" "🏭 Factory: 仕分けが終わりました。このタスクを受け入れて計画に進める場合は \`factory:plan\` ラベルを付けてください。"
          fi
