# Stage: Review   (Mastra Factory: Review board)
#
# Every PR gets its own review session, separate from the session that wrote it.
# Factory PRs loop: request-changes -> factory-fix -> review, up to FACTORY_MAX_FIX_ROUNDS,
# then escalate with `factory:needs-human`. Approved PRs wait for a person to merge.
# PRs opened by people in this repo are reviewed too, but never auto-fixed.
name: "Factory: review"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
      iteration:
        description: Fix rounds already done
        required: false
        default: "0"
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PR: ${{ inputs.pr_number || github.event.pull_request.number }}
  ITERATION: ${{ inputs.iteration || '0' }}
  MAX_ROUNDS: ${{ vars.FACTORY_MAX_FIX_ROUNDS || '2' }}
  READ_TOOLS: "Skill,Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git rev-parse:*)"
  CHECK_TOOLS: ${{ vars.FACTORY_CHECK_TOOLS || 'Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(node:*),Bash(python:*),Bash(pytest:*),Bash(make:*),Bash(go:*),Bash(cargo:*),Bash(ls:*)' }}

jobs:
  review:
    # Forks have no secrets, so only same-repo PRs are reviewed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: factory-pr-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # PRs opened before the secret is configured (including the one that adds the
      # factory) should not fail; just skip the review.
      - name: Check credentials
        id: creds
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ok=$HAS_KEY" >> "$GITHUB_OUTPUT"
          [ "$HAS_KEY" = true ] || echo "::notice::ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN not set; skipping factory review."

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: refs/pull/${{ env.PR }}/head
          fetch-depth: 0

      - name: Move to Review
        id: prepare
        if: steps.creds.outputs.ok == 'true'
        run: |
          # The checked-out PR head may not contain the factory files (e.g. human PRs
          # branched before the factory existed), so load the helpers from the base branch.
          git show "origin/$DEFAULT_BRANCH:.github/factory/lib.sh" > /tmp/factory-lib.sh 2>/dev/null \
            || cp .github/factory/lib.sh /tmp/factory-lib.sh
          source /tmp/factory-lib.sh
          set_stage pr "$PR" factory:review
          remove_label pr "$PR" factory:approved factory:needs-human
          add_label pr "$PR" factory:running
          mkdir -p "$FACTORY_TMP"
          echo "head=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Review agent
        if: steps.creds.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            factory-phase: pr-review（修正ラウンド ${{ env.ITERATION }}）
            リポジトリ: ${{ github.repository }} / PR: #${{ env.PR }}（ヘッドをチェックアウト済み）
            factory-review スキル（.claude/skills/factory-review/SKILL.md）に従って、この PR をレビューしてください。
            PR のブランチにスキルが無い場合は、`git show origin/${{ env.DEFAULT_BRANCH }}:.claude/skills/factory-review/SKILL.md` で読んでください。
          claude_args: >-
            --model ${{ vars.FACTORY_MODEL_REVIEW || vars.FACTORY_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "${{ env.READ_TOOLS }},${{ env.CHECK_TOOLS }}"

      - name: Hand off and route
        if: always() && steps.prepare.outcome == 'success'
        env:
          HEAD_SHA: ${{ steps.prepare.outputs.head }}
        run: |
          source /tmp/factory-lib.sh
          accept_handoff pr "$PR" approve request-changes
          reviewed=$(field reviewed_head)
          [ "$reviewed" = "$HEAD_SHA" ] || escalate pr "$PR" "レビューしたコミット（$reviewed）が PR のヘッド（$HEAD_SHA）と一致しません。"
          post_file pr "$PR" "$FACTORY_TMP/comment.md"
          remove_label pr "$PR" factory:running

          if [ "$VERDICT" = approve ]; then
            add_label pr "$PR" factory:approved
            remove_label pr "$PR" factory:changes-requested
            say pr "$PR" "🏭 Factory: レビューを通過しました。人間がマージしてください。"
            exit 0
          fi
          add_label pr "$PR" factory:changes-requested

          labels=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels -q '.labels[].name')
          grep -qx factory <<<"$labels" || exit 0      # human PRs: review only, no auto-fix
          if [ "$ITERATION" -lt "$MAX_ROUNDS" ]; then
            dispatch factory-fix.yml pr_number="$PR" iteration="$((ITERATION + 1))"
          else
            escalate pr "$PR" "修正を $ITERATION 回行ってもレビューを通過しませんでした。"
          fi
