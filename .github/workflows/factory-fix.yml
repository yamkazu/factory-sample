# Review stage, fix step: review feedback goes back to an implementing agent
# (Mastra: "feedback can return to the authoring session"). Dispatched by factory-review.yml.
name: "Factory: fix"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
      iteration:
        description: Fix round number (1-based)
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PR: ${{ inputs.pr_number }}
  READ_TOOLS: "Skill,Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git rev-parse:*)"
  WRITE_TOOLS: "Edit,MultiEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(mkdir:*)"
  CHECK_TOOLS: ${{ vars.FACTORY_CHECK_TOOLS || 'Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(node:*),Bash(python:*),Bash(pytest:*),Bash(make:*),Bash(go:*),Bash(cargo:*),Bash(ls:*)' }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: factory-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Resolve PR branch
        id: pr
        run: echo "branch=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Prepare
        id: prepare
        env:
          FACTORY_PROJECT_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          FACTORY_PROJECT_NUMBER: ${{ vars.FACTORY_PROJECT_NUMBER }}
          FACTORY_PROJECT_OWNER: ${{ vars.FACTORY_PROJECT_OWNER }}
        run: |
          source .github/factory/lib.sh
          add_label pr "$PR" factory:running
          git config user.name  "factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$FACTORY_TMP"

      # Add your toolchain here, same as factory-build.yml.

      - name: Fix agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            factory-phase: pr-review / fix（修正ラウンド ${{ inputs.iteration }}）
            リポジトリ: ${{ github.repository }} / PR: #${{ inputs.pr_number }}
            ブランチ: ${{ steps.pr.outputs.branch }}（チェックアウト済み）
            factory-fix スキル（.claude/skills/factory-fix/SKILL.md）に従って、レビューの指摘に対応してください。
          claude_args: >-
            --model ${{ vars.FACTORY_MODEL_BUILD || vars.FACTORY_MODEL || 'claude-opus-5-5' }}
            --max-turns 100
            --allowedTools "${{ env.READ_TOOLS }},${{ env.WRITE_TOOLS }},${{ env.CHECK_TOOLS }}"

      - name: Hand off back to Review
        if: always() && steps.prepare.outcome == 'success'
        env:
          FACTORY_PROJECT_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          FACTORY_PROJECT_NUMBER: ${{ vars.FACTORY_PROJECT_NUMBER }}
          FACTORY_PROJECT_OWNER: ${{ vars.FACTORY_PROJECT_OWNER }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          source .github/factory/lib.sh
          accept_handoff pr "$PR" fixed
          git fetch -q origin "$BRANCH"
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" ] || escalate pr "$PR" "ローカルの変更がすべてプッシュされていません。"
          post_file pr "$PR" "$FACTORY_TMP/comment.md"
          remove_label pr "$PR" factory:running factory:changes-requested
          dispatch factory-review.yml pr_number="$PR" iteration="${{ inputs.iteration }}"
